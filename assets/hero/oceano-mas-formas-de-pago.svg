<svg viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef9ff"/>
      <stop offset="55%" stop-color="#f7fcff"/>
      <stop offset="100%" stop-color="#fff8e6"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd23f" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffd23f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe6f7"/>
      <stop offset="35%" stop-color="#7fc3e8"/>
      <stop offset="100%" stop-color="#0873df"/>
    </linearGradient>
    <linearGradient id="seaDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0873df"/>
      <stop offset="100%" stop-color="#0758b5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="600" fill="url(#sky)"/>
  <circle cx="1230" cy="150" r="260" fill="url(#sun)"/>

  <!-- gaviotas -->
  <g stroke="#0758b5" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M120 110 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M220 160 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M980 90 q12 -12 24 0 q12 -12 24 0"/>
  </g>

  <!-- horizonte y mar -->
  <rect x="0" y="330" width="1600" height="270" fill="url(#sea)"/>

  <!-- velero -->
  <g transform="translate(300,255)">
    <path d="M0 78 L14 40 L14 78 Z" fill="#071d36"/>
    <path d="M18 78 L18 20 L46 78 Z" fill="#ffffff" opacity="0.92"/>
    <rect x="-26" y="78" width="72" height="12" rx="6" fill="#071d36"/>
  </g>

  <!-- olas -->
  <path d="M0 360 Q80 340 160 360 T320 360 T480 360 T640 360 T800 360 T960 360 T1120 360 T1280 360 T1440 360 T1600 360 V600 H0 Z" fill="url(#seaDeep)" opacity="0.28"/>
  <path d="M0 410 Q100 385 200 410 T400 410 T600 410 T800 410 T1000 410 T1200 410 T1400 410 T1600 410 V600 H0 Z" fill="#ffffff" opacity="0.10"/>
  <path d="M0 470 Q120 445 240 470 T480 470 T720 470 T960 470 T1200 470 T1440 470 T1600 470 V600 H0 Z" fill="#ffffff" opacity="0.08"/>
  <path d="M0 530 Q140 508 280 530 T560 530 T840 530 T1120 530 T1400 530 T1600 530 V600 H0 Z" fill="#071d36" opacity="0.06"/>
</svg>
